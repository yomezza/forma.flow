services:
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: forma
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      POSTGRES_DB: forma
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forma -d forma"]
      interval: 3s
      timeout: 3s
      retries: 20
  backend:
    build: .
    environment:
      DATABASE_URL: postgres://forma:${DB_PASSWORD:?set DB_PASSWORD}@db:5432/forma?sslmode=disable
      HTTP_ADDR: :8080
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      STUDIO_TIME_ZONE: ${STUDIO_TIME_ZONE:?set the actual studio IANA timezone}
      SOLVER_MAX_NODES: ${SOLVER_MAX_NODES:-100000}
      SOLVER_MAX_COMPONENT: ${SOLVER_MAX_COMPONENT:-100}
      DB_POOL_MAX: ${DB_POOL_MAX:-20}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
