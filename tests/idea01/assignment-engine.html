<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FORMA TELA · solver checks</title></head>
<body>
  <h1>Проверки matcher специалистов</h1>
  <pre id="results" aria-live="polite"></pre>
  <script src="../../dist/js/assignment-engine.js"></script>
  <script>
    const results=document.getElementById('results');
    const service=(id)=>({id,durationMinutes:60});
    function fixture({rooms=['R1'],specialists=['S1'],skills,bookings=[]}){
      return {
        settings:{breakMinutes:0,workDays:[0,1,2,3,4,5,6],start:'09:00',end:'18:00',step:30,blockedDates:[],vacations:[]},schedule:{activeMode:'simple',published:{}},
        rooms:rooms.map((id,index)=>({id,isActive:true,sortOrder:index})),
        specialists:specialists.map(id=>({id,state:'active'})),
        specialistServices:skills.flatMap(([id,serviceIds])=>serviceIds.map(serviceId=>({specialistId:id,serviceId}))),
        specialistSchedules:specialists.map(specialistId=>({specialistId,week:{0:[{start:'09:00',end:'18:00'}],1:[{start:'09:00',end:'18:00'}],2:[{start:'09:00',end:'18:00'}],3:[{start:'09:00',end:'18:00'}],4:[{start:'09:00',end:'18:00'}],5:[{start:'09:00',end:'18:00'}],6:[{start:'09:00',end:'18:00'}]},overrides:{}})),
        absenceRequests:[],bookings
      };
    }
    const cases=[
      ['advanced mode ignores drafts and obeys published days',()=>{
        const db=fixture({rooms:['R1'],specialists:['S1'],skills:[['S1',['A']]]});
        db.schedule.activeMode='advanced';
        db.schedule.drafts={'2026-11-09':{kind:'working',intervals:[{start:'09:00',end:'18:00'}]}};
        const candidate={id:'B1',serviceId:'A',date:'2026-11-09',time:'10:00',durationMinutes:60,status:'pending_confirmation'};
        if(FormaAssignmentEngine.solveAssignments(db,{date:candidate.date,candidate}).status!=='UNSAT')throw Error('draft was treated as published');
        db.schedule.published={'2026-11-09':{kind:'working',intervals:[{start:'09:00',end:'18:00'}]}};
        if(FormaAssignmentEngine.solveAssignments(db,{date:candidate.date,candidate}).status!=='SAT')throw Error('published working day rejected');
      }],
      ['blocked simple date rejects candidate',()=>{
        const db=fixture({rooms:['R1'],specialists:['S1'],skills:[['S1',['A']]]});
        db.settings.blockedDates=['2026-11-09'];
        const candidate={id:'B1',serviceId:'A',date:'2026-11-09',time:'10:00',durationMinutes:60,status:'pending_confirmation'};
        if(FormaAssignmentEngine.solveAssignments(db,{date:candidate.date,candidate}).status!=='UNSAT')throw Error('blocked date remained available');
      }],
      ['personal schedule boundary rejects too-long session',()=>{
        const db=fixture({rooms:['R1'],specialists:['S1'],skills:[['S1',['A']]]});
        db.specialistSchedules[0].week[1]=[{start:'09:00',end:'11:00'}];
        const candidate={id:'B1',serviceId:'A',date:'2026-11-09',time:'10:30',durationMinutes:60,status:'pending_confirmation'};
        if(FormaAssignmentEngine.solveAssignments(db,{date:candidate.date,candidate}).status!=='UNSAT')throw Error('session exceeded personal shift');
      }],
      ['search limit returns UNKNOWN',()=>{
        const db=fixture({rooms:['R1'],specialists:['S1'],skills:[['S1',['A']]]});
        const candidate={id:'B1',serviceId:'A',date:'2026-11-09',time:'10:00',durationMinutes:60,status:'pending_confirmation'};
        if(FormaAssignmentEngine.solveAssignments(db,{date:candidate.date,candidate,nodeLimit:0}).status!=='UNKNOWN')throw Error('limit was not represented as UNKNOWN');
      }],
      ['one room rejects overlap',()=>{
        const db=fixture({rooms:['R1'],specialists:['S1'],skills:[['S1',['A']]],bookings:[{id:'B1',serviceId:'A',date:'2026-11-09',time:'10:00',durationMinutes:60,status:'pending_confirmation'}]});
        const result=FormaAssignmentEngine.solveAssignments(db,{date:'2026-11-09',candidate:{id:'B2',serviceId:'A',date:'2026-11-09',time:'10:30',durationMinutes:60,status:'pending_confirmation'}});
        if(result.status!=='UNSAT')throw Error(result.status);
      }],
      ['two specialists and rooms allow parallel bookings',()=>{
        const db=fixture({rooms:['R1','R2'],specialists:['S1','S2'],skills:[['S1',['A']],['S2',['A']]]});
        db.bookings.push({id:'A1',serviceId:'A',date:'2026-11-09',time:'10:00',durationMinutes:60,status:'pending_confirmation'});
        const result=FormaAssignmentEngine.solveAssignments(db,{date:'2026-11-09',candidate:{id:'B1',serviceId:'A',date:'2026-11-09',time:'10:00',durationMinutes:60,status:'pending_confirmation'}});
        if(result.status!=='SAT'||new Set(Object.values(result.allocations).map(pair=>pair.roomId)).size!==2||new Set(Object.values(result.allocations).map(pair=>pair.specialistId)).size!==2)throw Error(JSON.stringify(result));
      }],
      ['MRV search finds specialist with exclusive skill',()=>{
        const db=fixture({rooms:['R1','R2'],specialists:['S1','S2'],skills:[['S1',['A','B']],['S2',['A']]],bookings:[{id:'A1',serviceId:'A',date:'2026-11-09',time:'10:00',durationMinutes:60,status:'pending_confirmation'}]});
        const result=FormaAssignmentEngine.solveAssignments(db,{date:'2026-11-09',candidate:{id:'B1',serviceId:'B',date:'2026-11-09',time:'10:00',durationMinutes:60,status:'pending_confirmation'}});
        if(result.status!=='SAT'||result.allocations.B1.specialistId!=='S1'||result.allocations.A1.specialistId!=='S2')throw Error(JSON.stringify(result));
      }],
      ['touching sessions are allowed without a break',()=>{
        const db=fixture({skills:[['S1',['A']]],bookings:[{id:'J1',serviceId:'A',date:'2026-11-09',time:'10:00',durationMinutes:60,status:'pending_confirmation'}]});
        const result=FormaAssignmentEngine.solveAssignments(db,{date:'2026-11-09',candidate:{id:'J2',serviceId:'A',date:'2026-11-09',time:'11:00',durationMinutes:60,status:'pending_confirmation'}});
        if(result.status!=='SAT')throw Error(JSON.stringify(result));
      }],
      ['break buffer rejects early starts and allows exact boundary',()=>{
        const db=fixture({skills:[['S1',['A']]],bookings:[{id:'J1',serviceId:'A',date:'2026-11-09',time:'10:00',durationMinutes:60,status:'pending_confirmation'}]});
        db.settings.breakMinutes=15;db.settings.step=5;
        const make=time=>({id:'J2',serviceId:'A',date:'2026-11-09',time,durationMinutes:60,status:'pending_confirmation'});
        for(const time of ['11:00','11:10'])if(FormaAssignmentEngine.solveAssignments(db,{date:'2026-11-09',candidate:make(time)}).status!=='UNSAT')throw Error('accepted '+time);
        if(FormaAssignmentEngine.solveAssignments(db,{date:'2026-11-09',candidate:make('11:15')}).status!=='SAT')throw Error('rejected exact break boundary');
      }],
      ['connected component follows an overlap chain',()=>{
        const db=fixture({rooms:['R1'],specialists:['S1'],skills:[['S1',['A']]],bookings:[
          {id:'J1',serviceId:'A',date:'2026-11-09',time:'10:00',durationMinutes:60,status:'pending_confirmation'},
          {id:'J2',serviceId:'A',date:'2026-11-09',time:'10:45',durationMinutes:60,status:'pending_confirmation'}
        ]});
        const result=FormaAssignmentEngine.solveAssignments(db,{date:'2026-11-09',candidate:{id:'J3',serviceId:'A',date:'2026-11-09',time:'11:30',durationMinutes:60,status:'pending_confirmation'}});
        if(result.status!=='UNSAT'||!result.affectedBookingIds.includes('J1')||!result.affectedBookingIds.includes('J2'))throw Error(JSON.stringify(result));
      }],
      ['fixed assignments stay in place when another pair is free',()=>{
        const db=fixture({rooms:['R1','R2'],specialists:['S1','S2'],skills:[['S1',['A']],['S2',['A']]],bookings:[{id:'J1',serviceId:'A',date:'2026-11-09',time:'10:00',durationMinutes:60,status:'confirmed',specialistId:'S1',roomId:'R1'}]});
        const result=FormaAssignmentEngine.solveAssignments(db,{date:'2026-11-09',candidate:{id:'J2',serviceId:'A',date:'2026-11-09',time:'10:00',durationMinutes:60,status:'pending_confirmation'}});
        if(result.status!=='SAT'||result.allocations.J1.specialistId!=='S1'||result.allocations.J1.roomId!=='R1'||result.allocations.J2.specialistId!=='S2')throw Error(JSON.stringify(result));
      }],
      ['two fixed bookings cannot double-book one specialist',()=>{
        const db=fixture({rooms:['R1','R2'],specialists:['S1','S2'],skills:[['S1',['A']],['S2',['A']]],bookings:[
          {id:'J1',serviceId:'A',date:'2026-11-09',time:'10:00',durationMinutes:60,status:'confirmed',specialistId:'S1',roomId:'R1'},
          {id:'J2',serviceId:'A',date:'2026-11-09',time:'10:00',durationMinutes:60,status:'confirmed',specialistId:'S1',roomId:'R2'}
        ]});
        if(FormaAssignmentEngine.solveAssignments(db,{date:'2026-11-09'}).status!=='UNSAT')throw Error('accepted double booking');
      }],
      ['result is deterministic when input arrays are reordered',()=>{
        const db=fixture({rooms:['R2','R1'],specialists:['S2','S1'],skills:[['S1',['A','B']],['S2',['A']]],bookings:[{id:'J1',serviceId:'A',date:'2026-11-09',time:'10:00',durationMinutes:60,status:'pending_confirmation'}]});
        const candidate={id:'J2',serviceId:'B',date:'2026-11-09',time:'10:00',durationMinutes:60,status:'pending_confirmation'};
        const first=FormaAssignmentEngine.solveAssignments(db,{date:'2026-11-09',candidate});
        db.rooms.reverse();db.specialists.reverse();db.bookings.reverse();
        const second=FormaAssignmentEngine.solveAssignments(db,{date:'2026-11-09',candidate});
        if(JSON.stringify(first)!==JSON.stringify(second))throw Error(JSON.stringify({first,second}));
      }]
    ];
    let passed=0;
    for(const [name,run] of cases){try{run();results.textContent+='PASS '+name+'\\n';passed++}catch(error){results.textContent+='FAIL '+name+': '+error.message+'\\n'}}
    results.textContent+='\\n'+passed+'/'+cases.length+' passed';
  </script>
</body>
</html>
