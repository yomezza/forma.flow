  "/api/v1/booking-requests":
    "post":
      "tags":
        - "Public"
      "operationId": "createBookingRequest"
      "summary": "Reserve a pending request atomically; replay returns 200 with same receipt"
      "parameters":
        -
          "$ref": "#/components/parameters/Idempotency"
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/BookingRequest"
            "example":
              "serviceId": "classic"
              "date": "2026-11-10"
              "time": "11:00"
              "fullName": "Иванов Иван"
              "phone": "+79991234567"
              "consentAccepted": true
              "consentVersion": "v1"
      "responses":
        "200":
          "description": "Idempotent replay of identical body/key"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/BookingReceipt"
        "201":
          "description": "Successful response"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/BookingReceipt"
              "example":
                "id": "ded1c777-2445-47b1-bbd3-33b74294ad07"
                "serviceId": "classic"
                "name": "Классический массаж"
                "durationMinutes": 60
                "priceAmount": 3500
                "currency": "RUB"
                "date": "2026-11-10"
                "time": "11:00"
                "status": "pending_confirmation"
        "400":
          "description": "Error 400"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ErrorEnvelope"
        "404":
          "description": "Error 404"
