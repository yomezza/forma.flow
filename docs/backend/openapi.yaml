# OpenAPI 3.1 contract for FORMA TELA Go backend; architecture, not deployed API
"openapi": "3.1.0"
"info":
  "title": "FORMA TELA Go Backend API"
  "version": "0.2.0"
  "description": "Design-stage contract. Prefix /api/v1. Requires auth for all admin paths; do not expose demo resets/import. One phone can belong to multiple clients; admin client association is explicit. Idea 01: studio resources with multiple specialists and rooms; joint assignment capacity is transactional."
"externalDocs":
  "description": "Existing JavaScript DemoAPI in the frontend branch (not a deployed REST backend)"
  "url": "https://github.com/yomezza/forma.flow/blob/frontend/docs/DEMO_API.md#L1-L108"
"servers":
  -
    "url": "/"
"tags":
  -
    "name": "Public"
  -
    "name": "Authentication"
  -
    "name": "Admin"
  -
    "name": "Schedule"
  -
    "name": "Specialist"
    "description": "Authenticated actions for assigned specialist only"
