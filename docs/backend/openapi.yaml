"components":
  "securitySchemes":
    "adminCookie":
      "type": "apiKey"
      "in": "cookie"
      "name": "ft_session"
  "parameters":
    "ServiceId":
      "name": "id"
      "in": "path"
      "required": true
      "schema":
        "type": "string"
    "BookingId":
      "name": "id"
      "in": "path"
      "required": true
      "schema":
        "type": "string"
        "format": "uuid"
    "ClientId":
      "name": "id"
      "in": "path"
      "required": true
      "schema":
        "type": "string"
        "format": "uuid"
    "VacationId":
      "name": "id"
      "in": "path"
      "required": true
      "schema":
        "type": "string"
        "format": "uuid"
    "HistoryId":
      "name": "id"
      "in": "path"
      "required": true
      "schema":
        "type": "string"
        "format": "uuid"
    "DatePath":
      "name": "date"
      "in": "path"
      "required": true
      "schema":
        "type": "string"
        "format": "date"
    "From":
      "name": "from"
      "in": "query"
      "required": true
      "schema":
        "type": "string"
        "format": "date"
    "To":
      "name": "to"
      "in": "query"
      "required": true
      "schema":
        "type": "string"
        "format": "date"
    "Date":
      "name": "date"
      "in": "query"
      "required": true
      "schema":
        "type": "string"
        "format": "date"
    "DateFilter":
      "name": "date"
      "in": "query"
      "required": false
      "schema":
        "type": "string"
        "format": "date"
    "ServiceQuery":
      "name": "serviceId"
      "in": "query"
      "required": false
      "schema":
        "type": "string"
    "ServiceRequired":
      "name": "serviceId"
      "in": "query"
      "required": true
      "schema":
        "type": "string"
    "Stage":
      "name": "stage"
      "in": "query"
      "required": true
      "schema":
        "type": "string"
        "enum":
          - "draft"
          - "published"
    "Status":
      "name": "status"
      "in": "query"
      "required": false
      "schema":
        "type": "string"
        "enum":
          - "pending_confirmation"
          - "confirmed"
          - "completed"
          - "cancelled"
    "Cursor":
      "name": "cursor"
      "in": "query"
      "required": false
      "schema":
        "type": "string"
    "Limit":
      "name": "limit"
      "in": "query"
      "required": false
      "schema":
        "type": "integer"
        "default": 25
        "minimum": 1
        "maximum": 100
    "Phone":
      "name": "phone"
      "in": "query"
      "required": true
      "schema":
        "type": "string"
    "Contains":
      "name": "contains"
      "in": "query"
      "required": false
      "schema":
        "type": "string"
        "format": "date"
    "Idempotency":
      "name": "Idempotency-Key"
      "in": "header"
      "required": true
      "schema":
        "type": "string"
        "minLength": 16
        "maxLength": 128
    "IfMatch":
      "name": "If-Match"
      "in": "header"
      "required": true
      "description": "Expected schedule revision as decimal integer"
      "schema":
        "type": "string"
    "Csrf":
      "name": "X-CSRF-Token"
      "in": "header"
      "required": true
      "schema":
        "type": "string"
  "schemas":
    "ErrorEnvelope":
      "type": "object"
      "properties":
        "error":
          "type": "object"
          "properties":
            "code":
              "type": "string"
            "message":
              "type": "string"
            "details":
              "type": "object"
              "additionalProperties": true
            "requestId":
              "type": "string"
          "required":
            - "code"
            - "message"
          "additionalProperties": false
      "required":
        - "error"
      "additionalProperties": false
    "Service":
      "type": "object"
      "properties":
        "id":
          "type": "string"
        "name":
          "type": "string"
        "description":
          "type": "string"
        "durationMinutes":
          "type": "integer"
          "minimum": 1
          "maximum": 1440
        "priceAmount":
          "type": "integer"
          "format": "int64"
          "minimum": 0
          "description": "Integer whole RUB in v1"
        "currency":
          "type": "string"
          "pattern": "^[A-Z]{3}$"
        "sortOrder":
          "type": "integer"
        "isActive":
          "type": "boolean"
        "visualSymbol":
          "type": "string"
      "required":
        - "id"
        - "name"
        - "durationMinutes"
        - "priceAmount"
        - "currency"
        - "isActive"
      "additionalProperties": false
    "ServiceInput":
      "type": "object"
      "properties":
        "id":
          "type": "string"
          "description": "Optional on creation; server may generate stable slug"
        "name":
          "type": "string"
        "description":
          "type": "string"
        "durationMinutes":
          "type": "integer"
          "minimum": 1
          "maximum": 1440
        "priceAmount":
          "type": "integer"
          "minimum": 0
        "currency":
          "type": "string"
          "const": "RUB"
        "sortOrder":
          "type": "integer"
        "isActive":
          "type": "boolean"
        "visualSymbol":
          "type": "string"
      "required":
        - "name"
        - "description"
        - "durationMinutes"
        - "priceAmount"
        - "currency"
        - "sortOrder"
        - "isActive"
        - "visualSymbol"
      "additionalProperties": false
    "ServicePatch":
      "type": "object"
      "minProperties": 1
      "additionalProperties": false
      "properties":
        "name":
          "type": "string"
        "description":
          "type": "string"
        "durationMinutes":
          "type": "integer"
          "minimum": 1
        "priceAmount":
          "type": "integer"
          "minimum": 0
        "sortOrder":
          "type": "integer"
        "isActive":
          "type": "boolean"
        "visualSymbol":
          "type": "string"
    "BookingRequest":
      "type": "object"
      "properties":
        "serviceId":
          "type": "string"
        "date":
          "type": "string"
          "format": "date"
        "time":
          "type": "string"
          "pattern": "^([01][0-9]|2[0-3]):[0-5][0-9]$"
        "fullName":
          "type": "string"
          "minLength": 3
          "maxLength": 120
        "phone":
          "type": "string"
          "pattern": "^\\+7[0-9]{10}$"
        "consentAccepted":
          "type": "boolean"
          "const": true
        "consentVersion":
          "type": "string"
          "minLength": 1
      "required":
        - "serviceId"
        - "date"
        - "time"
        - "fullName"
        - "phone"
        - "consentAccepted"
        - "consentVersion"
      "additionalProperties": false
    "BookingReceipt":
      "type": "object"
      "properties":
        "id":
          "type": "string"
          "format": "uuid"
        "serviceId":
          "type": "string"
        "name":
          "type": "string"
        "durationMinutes":
          "type": "integer"
        "priceAmount":
          "type": "integer"
          "format": "int64"
        "currency":
          "type": "string"
        "date":
          "type": "string"
          "format": "date"
        "time":
